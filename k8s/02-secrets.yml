# ============================================================
# Tfakkarni — Secret template (sensitive values)
# Keep placeholders out of real environments. Prefer creating this secret
# from CI/CD or kubectl with real values before deploying services.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: tfakkarni-secrets
  namespace: tfakkarni
type: Opaque
stringData:
  # Placeholder values are intentionally non-secret and valid for dry-run/demo clusters only.
  # Replace with real JDBC/user/password values using kubectl or your secret manager.
  NEON_GAME_DB_URL: "REPLACE_WITH_REAL_JDBC_URL"
  NEON_GAME_DB_USERNAME: "REPLACE_WITH_REAL_USERNAME"
  NEON_GAME_DB_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  RECAPTCHA_SECRET_KEY: "REPLACE_WITH_RECAPTCHA_SECRET_KEY"
