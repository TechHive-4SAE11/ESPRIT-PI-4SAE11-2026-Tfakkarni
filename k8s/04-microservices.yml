# ============================================================
# Microservices: All business services
# Template: Deployment + ClusterIP Service per microservice
# ============================================================

# ── User Service ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tfakkarni
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: tfakkarni/user:latest
          ports:
            - containerPort: 18081
          envFrom:
            - configMapRef:
                name: tfakkarni-config
            - secretRef:
                name: tfakkarni-secrets
          resources:
            limits: { memory: "512Mi", cpu: "500m" }
            requests: { memory: "256Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 18081 }
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tfakkarni
spec:
  selector:
    app: user-service
  ports:
    - port: 18081
      targetPort: 18081

