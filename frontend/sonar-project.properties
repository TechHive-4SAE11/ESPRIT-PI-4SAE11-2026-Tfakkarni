# ============================================================
# SonarQube Scanner Configuration — Angular Frontend
# ============================================================

sonar.projectKey=tfakkarni-frontend
sonar.projectName=Tfakkarni Frontend
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/test/**,**/dist/**,**/coverage/**

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Coverage report (generated by: ng test --watch=false --code-coverage)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.app.json

# SonarQube server
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8
