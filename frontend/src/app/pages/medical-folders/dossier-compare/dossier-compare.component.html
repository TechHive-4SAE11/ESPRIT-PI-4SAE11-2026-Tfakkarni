<div class="space-y-4">
  <div class="flex flex-wrap items-end gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">First entry</label>
      <select class="rounded-lg border border-input bg-background px-3 py-2 text-sm min-w-[200px]"
        [value]="selectedLeftId()" (change)="onLeftChange($any($event.target).value)">
        <option value="">— Select —</option>
        @for (item of itemsList(); track trackItem(item)) {
          <option [value]="item.id">{{ optionLabel(item) }}</option>
        }
      </select>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Second entry</label>
      <select class="rounded-lg border border-input bg-background px-3 py-2 text-sm min-w-[200px]"
        [value]="selectedRightId()" (change)="onRightChange($any($event.target).value)">
        <option value="">— Select —</option>
        @for (item of itemsList(); track trackItem(item)) {
          <option [value]="item.id">{{ optionLabel(item) }}</option>
        }
      </select>
    </div>
  </div>

  @if (diffRows().length > 0) {
    <div class="space-y-2">
      <div class="rounded-lg border border-border overflow-hidden">
        <div class="grid grid-cols-3 gap-0 bg-muted/50 text-sm font-medium">
          <div class="p-2 border-b border-r border-border">Field</div>
          <div class="p-2 border-b border-r border-border text-muted-foreground">Version A</div>
          <div class="p-2 border-b border-border text-muted-foreground">Version B</div>
        </div>
        @for (row of diffRows(); track row.field) {
          <div class="grid grid-cols-3 gap-0 border-b border-border last:border-b-0">
            <div class="p-2 border-r border-border font-medium text-sm">{{ row.label }}</div>
            <div class="p-2 border-r border-border text-sm min-h-8" [ngClass]="(row.status === 'removed' || row.status === 'changed') ? 'bg-destructive/10 text-destructive' : ''">
              {{ row.left || '—' }}
            </div>
            <div class="p-2 text-sm min-h-8" [ngClass]="(row.status === 'added' || row.status === 'changed') ? 'bg-emerald-500/10 text-emerald-700' : ''">
              {{ row.right || '—' }}
            </div>
          </div>
        }
      </div>
      <p class="text-xs text-muted-foreground flex items-center gap-1">
        <span class="inline-block w-3 h-3 rounded bg-destructive/30"></span> Removed / previous
        <span class="inline-block w-3 h-3 rounded bg-emerald-500/30 ml-2"></span> Added / updated
      </p>
    </div>
  } @else if (selectedLeftId() && selectedRightId()) {
    <p class="text-muted-foreground text-sm py-4">Select two different entries to compare.</p>
  }
</div>
