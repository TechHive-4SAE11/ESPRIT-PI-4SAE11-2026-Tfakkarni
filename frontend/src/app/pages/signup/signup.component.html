<div class="auth-shell p-4">
  <div class="auth-blob auth-blob-left"></div>
  <div class="auth-blob auth-blob-right"></div>

  <div class="w-full max-w-md auth-panel">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-3 brand-chip">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M12 4a6.5 6.5 0 0 0-6.5 6.5v3.7a3.8 3.8 0 0 0 3.8 3.8h.2v2h5v-2h.2a3.8 3.8 0 0 0 3.8-3.8v-3.7A6.5 6.5 0 0 0 12 4Z" />
            <path d="M9.7 10.2 12 12l2.3-1.8" />
          </svg>
        </span>
        <h1 class="text-3xl font-bold tracking-tight">tfakkarni</h1>
      </div>
      <p class="text-sm text-slate-600 mt-3">
        Alzheimer's Patient Monitoring Platform
      </p>
    </div>

    <z-card class="auth-card" zTitle="Create your account" zDescription="Join tfakkarni in less than a minute">
      <div class="space-y-5">
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="space-y-2">
              <label for="firstName" class="text-sm font-medium leading-none">
                First Name
              </label>
              <input z-input type="text" id="firstName" name="firstName" [(ngModel)]="firstName"
                placeholder="First name" class="w-full auth-input" required />
            </div>
            <div class="space-y-2">
              <label for="lastName" class="text-sm font-medium leading-none">
                Last Name
              </label>
              <input z-input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" placeholder="Last name"
                class="w-full auth-input" required />
            </div>
          </div>

          <div class="space-y-2">
            <label for="email" class="text-sm font-medium leading-none">
              Email
            </label>
            <input z-input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
              class="w-full auth-input" required />
          </div>

          <div class="space-y-2">
            <label for="password" class="text-sm font-medium leading-none">
              Password
            </label>
            <input z-input type="password" id="password" name="password" [(ngModel)]="password"
              placeholder="Create a password" class="w-full auth-input" required />
          </div>

          <div class="space-y-2">
            <label for="confirmPassword" class="text-sm font-medium leading-none">
              Confirm Password
            </label>
            <input z-input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
              placeholder="Confirm your password" class="w-full auth-input" required />
          </div>

          <div class="space-y-2">
            <span class="text-sm font-medium leading-none">
              I am a
            </span>
            <div class="grid grid-cols-2 gap-3">
              <button z-button type="button" [zType]="selectedRole === 'patient' ? 'default' : 'outline'" class="w-full"
                (click)="selectedRole = 'patient'">
                <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                </svg>
                Patient
              </button>
              <button z-button type="button" [zType]="selectedRole === 'doctor' ? 'default' : 'outline'" class="w-full"
                (click)="selectedRole = 'doctor'">
                <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 20a6 6 0 0 0-12 0" />
                  <circle cx="12" cy="10" r="4" />
                  <circle cx="12" cy="12" r="10" />
                </svg>
                Doctor
              </button>
            </div>
          </div>

          @if (selectedRole === 'patient') {
          <div class="space-y-2">
            <span class="text-sm font-medium leading-none">
              Gender
            </span>
            <div class="grid grid-cols-2 gap-3">
              <button z-button type="button" [zType]="selectedGender === 'male' ? 'default' : 'outline'" class="w-full"
                (click)="selectedGender = 'male'">
                <span class="mr-2">👨</span>
                Male
              </button>
              <button z-button type="button" [zType]="selectedGender === 'female' ? 'default' : 'outline'"
                class="w-full" (click)="selectedGender = 'female'">
                <span class="mr-2">👩</span>
                Female
              </button>
            </div>
          </div>
          }

          @if (errorMessage) {
          <div class="text-sm text-red-700 bg-red-50 border border-red-200 p-3 rounded-lg">
            {{ errorMessage }}
          </div>
          }

          @if (successMessage) {
          <div class="text-sm text-green-700 bg-green-50 border border-green-200 p-3 rounded-lg">
            {{ successMessage }}
          </div>
          }

          <button z-button type="submit" class="w-full auth-submit" zSize="lg" [disabled]="isLoading">
            @if (isLoading) {
            <span>Creating account...</span>
            } @else {
            <span>Sign Up</span>
            }
          </button>
        </form>

        <div class="text-center text-sm">
          <span class="text-slate-600">Already have an account? </span>
          <a routerLink="/login" class="font-semibold text-cyan-700 hover:text-cyan-800">
            Sign in
          </a>
        </div>
      </div>
    </z-card>

    <div class="mt-6 text-center text-xs text-slate-500">
      <p>&copy; 2026 tfakkarni. All rights reserved.</p>
    </div>
  </div>
</div>
