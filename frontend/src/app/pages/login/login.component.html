<div class="auth-shell p-4">
  <div class="auth-blob auth-blob-left"></div>
  <div class="auth-blob auth-blob-right"></div>

  <div class="w-full max-w-md auth-panel">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-3 brand-chip">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 4a6.5 6.5 0 0 0-6.5 6.5v3.7a3.8 3.8 0 0 0 3.8 3.8h.2v2h5v-2h.2a3.8 3.8 0 0 0 3.8-3.8v-3.7A6.5 6.5 0 0 0 12 4Z" />
            <path d="M9.7 10.2 12 12l2.3-1.8" />
          </svg>
        </span>
        <h1 class="text-3xl font-bold tracking-tight">tfakkarni</h1>
      </div>
      <p class="text-sm text-slate-600 mt-3">
        Alzheimer's Patient Monitoring Platform
      </p>
    </div>

    <z-card class="auth-card" zTitle="Welcome back" zDescription="Sign in to continue">
      <div class="space-y-5">
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="space-y-2">
            <label for="username" class="text-sm font-medium leading-none">
              Username or Email
            </label>
            <input z-input type="text" id="username" name="username" [(ngModel)]="username"
              placeholder="Enter your username or email" class="w-full auth-input" required />
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label for="password" class="text-sm font-medium leading-none">Password</label>
              <a routerLink="/forgot-password" class="text-xs text-cyan-700 hover:text-cyan-800 hover:underline font-medium">
                Mot de passe oublié ?
              </a>
            </div>
            <input z-input type="password" id="password" name="password" [(ngModel)]="password"
              placeholder="Enter your password" class="w-full auth-input" required />
          </div>

          @if (errorMessage) {
          <div class="text-sm text-red-700 bg-red-50 border border-red-200 p-3 rounded-lg">
            {{ errorMessage }}
          </div>
          }

          <button z-button type="submit" class="w-full auth-submit" zSize="lg" [disabled]="isLoading">
            @if (isLoading) {
            <span>Signing in...</span>
            } @else {
            <span>Sign In</span>
            }
          </button>
        </form>

        <div class="text-center text-sm">
          <span class="text-slate-600">Don't have an account? </span>
          <a routerLink="/signup" class="font-semibold text-cyan-700 hover:text-cyan-800">
            Sign up
          </a>
        </div>
      </div>
    </z-card>

    <div class="mt-6 text-center text-xs text-slate-500">
      <p>&copy; 2026 tfakkarni. All rights reserved.</p>
    </div>
  </div>
</div>
