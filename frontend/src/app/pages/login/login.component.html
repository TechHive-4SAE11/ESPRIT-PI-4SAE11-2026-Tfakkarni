<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 p-4">
  <div class="w-full max-w-md">
    <!-- Logo/Brand Section -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-primary mb-2">Tfakkarni</h1>
      <p class="text-muted-foreground text-sm">
        Alzheimer's Patient Monitoring Platform
      </p>
    </div>

    <!-- Login Card -->
    <z-card zTitle="Welcome to Tfakkarni" zDescription="Sign in to your account">
      <div class="space-y-6">
        <!-- Login Form -->
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <!-- Email/Username Input -->
          <div class="space-y-2">
            <label for="username"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Username or Email
            </label>
            <input z-input type="text" id="username" name="username" [(ngModel)]="username"
              placeholder="Enter your username or email" class="w-full" required />
          </div>

          <!-- Password Input -->
          <div class="space-y-2">
            <label for="password"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Password
            </label>
            <input z-input type="password" id="password" name="password" [(ngModel)]="password"
              placeholder="Enter your password" class="w-full" required />
          </div>

          <!-- Error Message -->
          @if (errorMessage) {
          <div class="text-sm text-red-600 dark:text-red-400">
            {{ errorMessage }}
          </div>
          }

          <!-- Sign In Button -->
          <button z-button type="submit" class="w-full" zSize="lg" [disabled]="isLoading">
            @if (isLoading) {
            <span>Signing in...</span>
            } @else {
            <span>Sign In</span>
            }
          </button>
        </form>

        <!-- Sign Up Link -->
        <div class="text-center text-sm">
          <span class="text-muted-foreground">Don't have an account? </span>
          <a routerLink="/signup" class="text-primary hover:underline font-medium">
            Sign up
          </a>
        </div>
      </div>
    </z-card>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-muted-foreground">
      <p>&copy; 2026 Tfakkarni. All rights reserved.</p>
    </div>
  </div>
</div>
