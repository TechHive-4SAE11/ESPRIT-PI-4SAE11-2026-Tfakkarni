<div class="max-w-xl mx-auto space-y-6">
    <z-card
      class="p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900/50"
    >
      <h1 class="text-2xl font-bold mb-2 text-gray-900 dark:text-white">
        Nouveau rappel
      </h1>
  
      @if (errorMessage) {
        <div
          class="mb-4 rounded-xl border border-red-200 bg-red-50 dark:bg-red-950/30 px-4 py-3 text-sm text-red-700 dark:text-red-300"
        >
          {{ errorMessage }}
        </div>
      }
  
      <form class="space-y-4" (ngSubmit)="onSubmit()">
        <!-- Type -->
        <div class="space-y-1">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
            Type de rappel *
          </label>
          <select
            class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 py-2 text-sm"
            [(ngModel)]="form.reminderType"
            name="reminderType"
            required
          >
            <option value="" disabled>Choisir un type</option>
            <option value="CONFIRMATION">CONFIRMATION</option>
            <option value="PREPARATION">PREPARATION</option>
            <option value="FEEDBACK">FEEDBACK</option>
          </select>
        </div>
  
        <!-- Date / heure -->
        <div class="space-y-1">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
            Date et heure *
          </label>
          <input
            z-input
            type="datetime-local"
            class="w-full"
            [(ngModel)]="form.reminderTime"
            name="reminderTime"
            required
          />
        </div>
  
        <!-- Canal -->
        <div class="space-y-1">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
            Canal *
          </label>
          <div class="flex flex-wrap gap-3">
            <label class="inline-flex items-center gap-2 text-sm">
              <input
                type="radio"
                [(ngModel)]="form.channel"
                name="channel"
                value="SMS"
              />
              <span>SMS</span>
            </label>
            <label class="inline-flex items-center gap-2 text-sm">
              <input
                type="radio"
                [(ngModel)]="form.channel"
                name="channel"
                value="EMAIL"
              />
              <span>Email</span>
            </label>
            <label class="inline-flex items-center gap-2 text-sm">
              <input
                type="radio"
                [(ngModel)]="form.channel"
                name="channel"
                value="PUSH"
              />
              <span>Push</span>
            </label>
          </div>
        </div>
  
        <!-- Téléphone -->
        @if (showPhone) {
          <div class="space-y-1">
            <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
              Téléphone *
            </label>
            <input
              z-input
              type="tel"
              class="w-full"
              [(ngModel)]="form.patientPhone"
              name="patientPhone"
              required
            />
          </div>
        }
  
        <!-- Email -->
        @if (showEmail) {
          <div class="space-y-1">
            <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
              Email *
            </label>
            <input
              z-input
              type="email"
              class="w-full"
              [(ngModel)]="form.patientEmail"
              name="patientEmail"
              required
            />
          </div>
        }
  
        <!-- Message -->
        <div class="space-y-1">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-200">
            Message (optionnel)
          </label>
          <textarea
            z-input
            class="w-full min-h-[100px]"
            [(ngModel)]="form.message"
            name="message"
          ></textarea>
        </div>
  
        <div class="flex flex-wrap gap-3 pt-2">
          <button
            z-button
            zSize="lg"
            class="rounded-full px-6"
            type="submit"
            [zLoading]="isSubmitting"
          >
            Créer
          </button>
          <button
            z-button
            zType="outline"
            zSize="lg"
            class="rounded-full px-6"
            type="button"
            (click)="cancel()"
          >
            Annuler
          </button>
        </div>
      </form>
    </z-card>
  </div>
