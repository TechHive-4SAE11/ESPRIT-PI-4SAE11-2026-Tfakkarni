jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${DEVOPS_ADMIN_USER}"
          password: "${DEVOPS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  systemMessage: "Welcome to Tfakkarni Jenkins DevOps Server - Automated with JCasC! 🎉"
  numExecutors: 2
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "git-credentials"
              username: "${GIT_CREDENTIAL_USER}"
              password: "${GIT_CREDENTIAL_PAT}"
              description: "GitHub Credentials (PAT)"
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_PASSWORD}"
              description: "DockerHub Credentials"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONARQUBE_TOKEN}"
              description: "SonarQube Token"

unclassified:
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

tool:
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.6"
  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodejsInstaller:
                    id: "20.12.2"

jobs:
  - script: |
      def repoUrl = 'https://github.com/TechHive-4SAE11/ESPRIT-PI-4SAE11-2026-Tfakkarni.git'
      def defaultBranch = 'agent'
      def dockerRepository = 'thelime1/tfakkarni'

      def backendServices = [
          ['discovery-service', 'discovery'],
          ['config-service', 'config'],
          ['api-gateway', 'gateway'],
          ['user-service', 'user'],
          ['game-service', 'game'],
          ['tracking-service', 'tracking'],
          ['alert-service', 'alert'],
          ['ml-service', 'ml'],
          ['medical-service', 'medical'],
          ['medicament-validation-service', 'medicament-validation'],
          ['iot-service', 'iot'],
          ['assistant-service', 'assistant'],
          ['analytics-service', 'analytics']
      ]

      def applyScmDefinition = { jobContext, String branchName, String includedPattern, String scriptPathValue ->
          jobContext.definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url(repoUrl)
                              credentials('git-credentials')
                          }
                          branch(branchName)
                          extensions {
                              cloneOptions {
                                  shallow(true)
                                  noTags(true)
                                  depth(1)
                                  timeout(30)
                              }
                              if (includedPattern?.trim()) {
                                  pathRestriction {
                                      includedRegions(includedPattern)
                                      excludedRegions('')
                                  }
                              }
                          }
                      }
                  }
                  scriptPath(scriptPathValue)
              }
          }
      }

      backendServices.each { svc ->
          def svcKey = svc[0]
          def imageTag = svc[1]

          pipelineJob('Backend-' + svcKey + '-CI') {
              description('CI for ' + svcKey + ': build/test, build Docker image, push to Docker Hub')
              parameters {
                  stringParam('SERVICE_NAME', svcKey, 'Backend Maven module and Kubernetes deployment name')
                  stringParam('SERVICE_IMAGE_TAG', imageTag, 'Docker tag prefix used by Kubernetes')
                  stringParam('BRANCH_NAME', defaultBranch, 'Git branch to build')
                  stringParam('DOCKER_REPOSITORY', dockerRepository, 'Docker Hub repository used by Kubernetes')
                  booleanParam('RUN_TESTS', true, 'Run Maven tests before publishing image')
                  booleanParam('RUN_SONAR', false, 'Run SonarQube analysis')
              }
              applyScmDefinition(delegate, defaultBranch, 'backend/' + svcKey + '/.*\nbackend/pom.xml\nJenkinsfile.ci', 'Jenkinsfile.ci')
          }

          pipelineJob('Backend-' + svcKey + '-CD') {
              description('CD for ' + svcKey + ': pull Docker Hub image and deploy only this service to Kubernetes')
              parameters {
                  stringParam('SERVICE_NAME', svcKey, 'Kubernetes deployment/container name')
                  stringParam('SERVICE_IMAGE_TAG', imageTag, 'Docker tag prefix produced by CI')
                  stringParam('DOCKER_REPOSITORY', dockerRepository, 'Docker Hub repository to deploy from')
                  stringParam('IMAGE_TAG', imageTag, 'Exact image tag from CI, e.g. ' + imageTag + '-123. Default deploys latest service tag.')
                  stringParam('KUBE_NAMESPACE', 'tfakkarni', 'Kubernetes namespace')
                  stringParam('MANIFEST_BRANCH', defaultBranch, 'Git branch used for manifests')
                  booleanParam('APPLY_MANIFESTS', true, 'Apply Kubernetes manifests before setting image')
                  booleanParam('WAIT_FOR_ROLLOUT', true, 'Wait for Kubernetes rollout')
              }
              applyScmDefinition(delegate, defaultBranch, "k8s/.*\nJenkinsfile.cd", 'Jenkinsfile.cd')
          }
      }

      pipelineJob('Frontend-CI') {
          description('Frontend CI: install/test/build, build Docker image, push to Docker Hub')
          parameters {
              stringParam('BRANCH_NAME', defaultBranch, 'Git branch to build')
              stringParam('DOCKER_REPOSITORY', dockerRepository, 'Docker Hub repository used by Kubernetes')
              booleanParam('RUN_TESTS', true, 'Run Angular tests')
              booleanParam('RUN_SONAR', false, 'Run SonarQube analysis')
          }
          applyScmDefinition(delegate, defaultBranch, "frontend/.*\nJenkinsfile.cifrontend", 'Jenkinsfile.cifrontend')
      }

      pipelineJob('Frontend-CD') {
          description('Frontend CD: pull Docker Hub image and deploy frontend to Kubernetes')
          parameters {
              stringParam('DOCKER_REPOSITORY', dockerRepository, 'Docker Hub repository to deploy from')
              stringParam('IMAGE_TAG', 'frontend', 'Exact image tag from CI, e.g. frontend-123. Default deploys latest frontend tag.')
              stringParam('KUBE_NAMESPACE', 'tfakkarni', 'Kubernetes namespace')
              stringParam('MANIFEST_BRANCH', defaultBranch, 'Git branch used for manifests')
              booleanParam('APPLY_MANIFESTS', true, 'Apply Kubernetes manifests before setting image')
              booleanParam('WAIT_FOR_ROLLOUT', true, 'Wait for Kubernetes rollout')
          }
          applyScmDefinition(delegate, defaultBranch, "k8s/.*\nJenkinsfile.cdfrontend", 'Jenkinsfile.cdfrontend')
      }
