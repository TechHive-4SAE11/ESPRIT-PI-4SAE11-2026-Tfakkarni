# ============================================================
# Prometheus configuration for Tfakkarni project
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Spring Boot Microservices ──
  # All services expose /actuator/prometheus via micrometer-registry-prometheus

  - job_name: 'discovery-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['discovery-service:8761']
        labels:
          service: discovery-service
          type: infrastructure

  - job_name: 'config-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config-service:8888']
        labels:
          service: config-service
          type: infrastructure

  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:9090']
        labels:
          service: api-gateway
          type: infrastructure

  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:18081']
        labels:
          service: user-service
          type: microservice

  - job_name: 'game-service'
