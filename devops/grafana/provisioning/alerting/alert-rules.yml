apiVersion: 1

groups:
  - orgId: 1
    name: tfakkarni-demo-alerts
    folder: Tfakkarni Alerts
    interval: 1m
    rules:
      - uid: tfakkarni-demo-deploy-alert
        title: Demo deployment status alert
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: "1"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: math
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Demo deployment alert visible in Grafana UI
          description: Static demo alert for the UI proof. It does not send Telegram or external notifications.
        labels:
          area: deployment
          severity: demo
      - uid: tfakkarni-demo-machine-alert
