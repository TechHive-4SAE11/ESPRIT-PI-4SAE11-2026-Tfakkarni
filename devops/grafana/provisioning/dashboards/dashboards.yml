# Grafana dashboard provisioning — auto-loads dashboards from file
apiVersion: 1

providers:
  - name: "Tfakkarni Dashboards"
    orgId: 1
    folder: "Tfakkarni"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
