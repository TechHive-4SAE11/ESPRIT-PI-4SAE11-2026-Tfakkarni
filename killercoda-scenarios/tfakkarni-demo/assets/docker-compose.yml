    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  analytics-service:
    container_name: tfakkarni-analytics
    image: thelime1/tfakkarni:analytics
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18090:18090"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18090/actuator/health"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # --- OBSERVABILITY ---
  zipkin:
    container_name: tfakkarni-zipkin
    image: openzipkin/zipkin:latest
    ports: ["9411:9411"]
    networks: [tfakkarni-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # --- OBSERVABILITY ---
  zipkin:
    container_name: tfakkarni-zipkin
    image: openzipkin/zipkin:latest
    ports: ["9411:9411"]
    networks: [tfakkarni-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # --- FRONTEND ---
  frontend:
    container_name: tfakkarni-frontend
    image: thelime1/tfakkarni:frontend
    ports: ["18080:80"]
    networks: [tfakkarni-network]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

networks:
  tfakkarni-network:
    name: tfakkarni-network
    driver: bridge
