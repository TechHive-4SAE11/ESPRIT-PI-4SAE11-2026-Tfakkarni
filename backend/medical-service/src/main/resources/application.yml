server:
  port: 18086

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: medical-service

  datasource:
    url: jdbc:postgresql://ep-young-recipe-ag0a1sn7-pooler.c-2.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require
    username: neondb_owner
    password: npg_3uElGswIc7gk
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Console H2 pour voir les données
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      model: gpt-3.5-turbo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# Alert service (for appointment reminders)
alert-service:
  url: http://localhost:18084

# Google Calendar Configuration
google:
  calendar:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:18086/api/medical/calendar/callback}
    application-name: Tfakkarni Medical
    credentials-path: classpath:/credentials.json