spring:
  application:
    name: medical-service

  # config service/client — values below are fallbacks used when config-server is not running
  cloud:
    config:
      enabled: true
  config:
    import: optional:configserver:http://localhost:8888

  # Fallback datasource (overridden by config-server when running)
  datasource:
    url: jdbc:postgresql://ep-young-recipe-ag0a1sn7-pooler.c-2.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require
    username: neondb_owner
    password: npg_3uElGswIc7gk
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # OpenAI — set OPENAI_API_KEY env var for real AI features; demo-key disables them gracefully
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      model: gpt-3.5-turbo
  # Google Calendar — set env vars for real calendar integration
  google:
    calendar:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:18086/api/medical/calendar/callback}
      application-name: Tfakkarni Medical
      credentials-path: classpath:/credentials.json

server:
  port: 18086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always