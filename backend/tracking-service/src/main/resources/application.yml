spring:
  application:
    name: tracking-service
  config:
    import: optional:configserver:http://localhost:8888

  servlet:
    context-path: /api/tracking
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://ep-young-recipe-ag0a1sn7-pooler.c-2.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_3uElGswIc7gk
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  task:
    scheduling:
      pool:
        size: 5  # Thread pool size for scheduled tasks

# Medication status scheduler configuration
medication:
  scheduler:
    enabled: true
    daily-update-cron: "0 0 0 * * *"          # Midnight daily
    periodic-update-cron: "0 0 */6 * * *"     # Every 6 hours

# Daily follow-up reminder scheduler
followup:
  scheduler:
    cron: "0 0 22 * * *"                       # Every day at 22:00

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

