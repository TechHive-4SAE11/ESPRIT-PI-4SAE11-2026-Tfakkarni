server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: keycloak
          uri: http://localhost:8280
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Origin
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: game-service
          uri: lb://game-service
          predicates:
            - Path=/api/games/**
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
        - id: medical-folders
          uri: lb://tracking-service
          predicates:
            - Path=/api/medical-folders/**
        - id: prescriptions
          uri: lb://tracking-service
          predicates:
            - Path=/api/prescriptions/**
        - id: sessions
          uri: lb://tracking-service
          predicates:
            - Path=/api/sessions/**
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**
        - id: ml-service
          uri: lb://ml-service
          predicates:
            - Path=/api/ml/**
        - id: medical-service
          uri: lb://medical-service
          predicates:
            - Path=/api/medical/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/techhive
          jwk-set-uri: http://localhost:8280/realms/techhive/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

recaptcha:
  secret:
    key: "6LfSr30sAAAAAO3Nu-3tXILWfm0IBZezbpMAQG1I"
