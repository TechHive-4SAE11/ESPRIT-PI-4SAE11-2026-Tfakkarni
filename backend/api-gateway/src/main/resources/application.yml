server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "X-User-Id"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: game-service
          uri: lb://game-service
          predicates:
            - Path=/api/games/**
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
        - id: medical-folders
          uri: lb://tracking-service
          predicates:
            - Path=/api/medical-folders/**
        - id: care-plans
          uri: lb://tracking-service
          predicates:
            - Path=/api/care-plans/**
        - id: prescriptions
          uri: lb://tracking-service
          predicates:
            - Path=/api/prescriptions/**
        - id: prescription-templates
          uri: lb://tracking-service
          predicates:
            - Path=/api/prescription-templates/**
        - id: sessions
          uri: lb://tracking-service
          predicates:
            - Path=/api/sessions/**
        - id: medications
          uri: lb://tracking-service
          predicates:
            - Path=/api/medications/**
        - id: admin-medication-status
          uri: lb://tracking-service
          predicates:
            - Path=/api/admin/**
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**
        - id: ml-service
          uri: lb://ml-service
          predicates:
            - Path=/api/ml/**
        - id: medical-service
          uri: lb://medical-service
          predicates:
            - Path=/api/medical/**
        - id: medicament-validation-service
          uri: lb://medicament-validation-service
          predicates:
            - Path=/api/medicament-validation/**
        - id: tracking-service-daily
          uri: lb://tracking-service
          predicates:
            - Path=/api/daily-monitoring/**
        - id: health-score
          uri: lb://tracking-service
          predicates:
            - Path=/api/health-score/**
        - id: statistics
          uri: lb://tracking-service
          predicates:
            - Path=/api/statistics/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/techhive
          jwk-set-uri: http://localhost:8280/realms/techhive/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
