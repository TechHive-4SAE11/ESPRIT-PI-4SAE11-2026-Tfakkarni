server:
  port: 18089

spring:
  application:
    name: assistant-service

  # config service/client — values below are fallbacks used when config-server is not running
  cloud:
    config:
      enabled: true
  config:
    import: optional:configserver:http://localhost:8888

  # ── Database (H2 local fallback) ──
  datasource:
    url: jdbc:h2:mem:assistantdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # ── Spring AI - OpenAI ──
  ai:
    openai:
      api-key: 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
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7
          max-tokens: 2000

# ── Eureka ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── Feign ──
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: BASIC

# ── External Video API (Pexels) ──
assistant:
  video:
    provider: PEXELS
    pexels:
      api-key: "VaN3nyY1QpMdhBuY3ChDloAn06JUCO3oARELtzSVUQoy9WPPu8nQHeUq"
      api-url: "https://api.pexels.com"

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ──
logging:
  level:
    org.techhive.assistantservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG

# ── Springdoc ──
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
