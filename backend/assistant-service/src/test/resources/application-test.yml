server:
  port: 18089

spring:
  application:
    name: assistant-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  ai:
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-4
          temperature: 0.7

eureka:
  client:
    enabled: false
