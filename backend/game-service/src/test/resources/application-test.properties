# Test properties - disable external services
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Stub external API keys for controller tests
google.translate.api-key=test-key
elevenlabs.api-key=test-key
elevenlabs.voice-id-en=test-voice-en
elevenlabs.voice-id-tn=test-voice-tn
elevenlabs.model-id=test-model

# In full @SpringBootTest, use in-memory H2 so JPA repositories are available.
spring.datasource.url=jdbc:h2:mem:game_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
