server:
  port: 18090

spring:
  application:
    name: analytics-service

  cloud:
    config:
      enabled: true
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://ep-cold-credit-alglq1kq-pooler.c-3.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_wNa0As4fytdT
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  task:
    scheduling:
      pool:
        size: 3

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Score computation settings
analytics:
  score:
    cache-ttl-minutes: 60
    weights:
      cognitive: 0.30
      daily-functioning: 0.25
      medical-stability: 0.20
      iot-risk: 0.15
      engagement: 0.10
