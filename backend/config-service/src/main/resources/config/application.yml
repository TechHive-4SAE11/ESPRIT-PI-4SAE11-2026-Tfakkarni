# ============================================================
# GLOBAL CONFIG — shared by ALL microservices
# Served by config-service to every client that connects
# ============================================================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
