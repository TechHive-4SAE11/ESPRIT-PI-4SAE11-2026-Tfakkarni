# ============================================================
# medical-service — centralized config
# ============================================================
server:
  port: 18086
  servlet:
    context-path: /

spring:
  datasource:
    url: ${NEON_MEDICAL_DB_URL}
    username: ${NEON_SHARED_DB_USERNAME}
    password: ${NEON_SHARED_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      model: gpt-3.5-turbo

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.techhive.medicalservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.actuate.health: DEBUG

alert-service:
  url: http://localhost:18084

coaching:
  stale-days: 7
  stale-notification-cooldown-hours: 168
  scheduler:
    stale-cron: "0 */5 * * * ?"
  weather:
    enabled: true

medical:
  analytics:
    safety-audit:
      presentation-demo: ${SAFETY_AUDIT_PRESENTATION_DEMO:false}
      gemini:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
        model: gemini-2.5-flash
        max-patients-per-request: 48

google:
  calendar:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:18086/api/medical/calendar/callback}
    application-name: Tfakkarni Medical
    credentials-path: classpath:/credentials.json
