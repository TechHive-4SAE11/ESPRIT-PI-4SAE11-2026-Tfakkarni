# ============================================================
# user-service — centralized config
# ============================================================
server:
  port: 18081

spring:
  datasource:
    url: ${NEON_USER_DB_URL}
    username: ${NEON_USER_DB_USERNAME}
    password: ${NEON_USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        auto_quote_keyword: true

keycloak:
  server-url: https://lemur-12.cloud-iam.com/auth
  realm: tfakkarni
  admin:
    username: admin
    password: "${KEYCLOAK_ADMIN_PASSWORD}"
  frontend-client-id: tfakkarni-frontend

mailtrap:
  token: ${MAILTRAP_TOKEN}
  inbox-id: ${MAILTRAP_INBOX_ID}
  from: noreply@tfakkarni.com

didit:
  api-key: ${DIDIT_API_KEY:}
  workflow-id: ${DIDIT_WORKFLOW_ID:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
