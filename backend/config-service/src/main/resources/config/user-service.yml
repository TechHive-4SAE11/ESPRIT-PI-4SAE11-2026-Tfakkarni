server:
  port: 18081

spring:

  profiles:
    active: prod  # Change to 'local' for H2 database
  datasource:
    # Replace with YOUR Neon connection string from https://console.neon.tech (Dashboard → Connection string)
    url: ${NEON_DATABASE_URL:jdbc:postgresql://ep-purple-sun-aga3c9f6-pooler.c-2.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
    username: ${NEON_USER:neondb_owner}
    password: ${NEON_PASSWORD:npg_4kKCY7bocxUn}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        auto_quote_keyword: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

keycloak:
  server-url: http://localhost:8280
  realm: techhive
  admin:
    username: admin
    password: admin

didit:
  api-key: ${DIDIT_API_KEY:}
  workflow-id: ${DIDIT_WORKFLOW_ID:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
