# ============================================================
# ml-service — centralized config
# ============================================================
server:
  port: 18085

spring:
  ai:
    huggingface:
      api-key: ${HUGGINGFACE_API_KEY}
      chat:
        options:
          model: meta-llama/Llama-2-7b-chat-hf
  datasource:
    url: ${NEON_SHARED_DB_URL}
    username: ${NEON_SHARED_DB_USERNAME}
    password: ${NEON_SHARED_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash

huggingface:
  api-key: ${HUGGINGFACE_API_KEY:}
  model: facebook/bart-large-mnli

ml:
  twilio:
    account-sid: ${ML_TWILIO_SID:}
    auth-token: ${ML_TWILIO_TOKEN:}
    phone-number: ${ML_TWILIO_PHONE:}
    whatsapp-number: ${ML_TWILIO_WHATSAPP:}
    doctor-phone: ${ML_DOCTOR_PHONE:}
