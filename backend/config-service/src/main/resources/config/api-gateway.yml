# ============================================================
# api-gateway — centralized config
# ============================================================
server:
  port: 9090

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "X-User-Id"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: password-reset
          uri: lb://user-service
          predicates:
            - Path=/api/password-reset/**
        - id: game-service
          uri: lb://game-service
          predicates:
            - Path=/api/games/**
        - id: tracking-service
          uri: lb://tracking-service
          predicates:
            - Path=/api/tracking/**
        - id: medical-folders-post
          uri: lb://medical-service
          predicates:
            - Path=/api/medical-folders
            - Method=POST
          filters:
            - PatientIdQueryToHeader
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
        - id: medical-folders
          uri: lb://medical-service
          predicates:
            - Path=/api/medical-folders/**
        - id: diagnostics
          uri: lb://medical-service
          predicates:
            - Path=/api/diagnostics/**
        - id: diagnostic-attachments
          uri: lb://medical-service
          predicates:
            - Path=/api/diagnostic-attachments/**
        - id: medical-history
          uri: lb://medical-service
          predicates:
            - Path=/api/medical-history/**
        - id: ai-reports
          uri: lb://medical-service
          predicates:
            - Path=/api/ai-reports/**
        - id: care-plans
          uri: lb://tracking-service
          predicates:
            - Path=/api/care-plans/**
        - id: prescriptions
          uri: lb://tracking-service
          predicates:
            - Path=/api/prescriptions/**
        - id: prescription-templates
          uri: lb://tracking-service
          predicates:
            - Path=/api/prescription-templates/**
        - id: sessions
          uri: lb://tracking-service
          predicates:
            - Path=/api/sessions/**
        - id: medications
          uri: lb://tracking-service
          predicates:
            - Path=/api/medications/**
        - id: admin-medication-status
          uri: lb://tracking-service
          predicates:
            - Path=/api/admin/**
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**
        - id: ml-service
          uri: lb://ml-service
          predicates:
            - Path=/api/ml/**
        - id: medical-service
          uri: lb://medical-service
          predicates:
            - Path=/api/medical/**
        - id: medicament-validation-service
          uri: lb://medicament-validation-service
          predicates:
            - Path=/api/medicament-validation/**
        - id: tracking-service-daily
          uri: lb://tracking-service
          predicates:
            - Path=/api/daily-monitoring/**
        - id: health-score
          uri: lb://tracking-service
          predicates:
            - Path=/api/health-score/**
        - id: statistics
          uri: lb://tracking-service
          predicates:
            - Path=/api/statistics/**
        - id: notifications
          uri: lb://tracking-service
          predicates:
            - Path=/api/notifications/**
        - id: iot-service
          uri: lb://iot-service
          predicates:
            - Path=/api/iot/**
        - id: assistant-service-ai
          uri: lb://assistant-service
          predicates:
            - Path=/api/ai/**
        - id: assistant-service-ws
          uri: lb://assistant-service
          predicates:
            - Path=/ws/**
        - id: meetings
          uri: lb://tracking-service
          predicates:
            - Path=/api/meetings/**
        - id: follow-up-reminders
          uri: lb://tracking-service
          predicates:
            - Path=/api/follow-up-reminders/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://lemur-12.cloud-iam.com/auth/realms/tfakkarni
          jwk-set-uri: https://lemur-12.cloud-iam.com/auth/realms/tfakkarni/protocol/openid-connect/certs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

recaptcha:
  secret:
    key: "6LfSr30sAAAAAO3Nu-3tXILWfm0IBZezbpMAQG1I"
