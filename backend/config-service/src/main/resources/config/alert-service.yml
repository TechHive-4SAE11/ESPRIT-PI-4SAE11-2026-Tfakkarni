# ============================================================
# alert-service — centralized config
# ============================================================
server:
  port: 18084

spring:
  datasource:
    url: ${NEON_SHARED_DB_URL}
    username: ${NEON_SHARED_DB_USERNAME}
    password: ${NEON_SHARED_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 60000
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
      cache-null-values: false

firebase:
  config-file: classpath:firebase-service-account.json

tracking-service:
  url: http://localhost:18083

notification:
  scheduler:
    enabled: true
    medication-reminder-cron: "0 */1 * * * *"

mailtrap:
  token: ${MAILTRAP_TOKEN}
  inbox-id: ${MAILTRAP_INBOX_ID}
  from: noreply@tfakkarni.com

telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN}"
  default-chat-id: "${TELEGRAM_CHAT_ID}"