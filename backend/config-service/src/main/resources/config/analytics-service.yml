# ============================================================
# analytics-service — centralized config
# ============================================================
server:
  port: 18090

spring:
  datasource:
    url: ${NEON_IOT_DB_URL}
    username: ${NEON_IOT_DB_USERNAME}
    password: ${NEON_IOT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  task:
    scheduling:
      pool:
        size: 3
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour
      cache-null-values: false

analytics:
  score:
    cache-ttl-minutes: 60
    weights:
      cognitive: 0.30
      daily-functioning: 0.25
      medical-stability: 0.20
      iot-risk: 0.15
      engagement: 0.10
