# ============================================================
# iot-service — centralized config
# ============================================================
server:
  port: 18088

spring:
  datasource:
    url: ${NEON_IOT_DB_URL}
    username: ${NEON_IOT_DB_USERNAME}
    password: ${NEON_IOT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN}"
  default-chat-id: "${TELEGRAM_CHAT_ID}"

heartbeat:
  alert:
    high-bpm: 120
    low-bpm: 40
    cooldown-minutes: 10
