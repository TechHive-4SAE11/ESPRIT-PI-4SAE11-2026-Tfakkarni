# ============================================================
# game-service — centralized config
# ============================================================
server:
  port: 18082

spring:
  datasource:
    url: ${NEON_GAME_DB_URL}
    username: ${NEON_GAME_DB_USERNAME}
    password: ${NEON_GAME_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

tmdb:
  api-key: ${TMDB_API_KEY}

google:
  translate:
    api-key: ${GOOGLE_TRANSLATE_API_KEY:YOUR_GOOGLE_TRANSLATE_API_KEY}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:YOUR_ELEVENLABS_API_KEY}
  voice-id-en: 2qfp6zPuviqeCOZIE9RZ
  voice-id-tn: GLRyn2pNxpZ4FAjmlY3z
  model-id: eleven_multilingual_v2
