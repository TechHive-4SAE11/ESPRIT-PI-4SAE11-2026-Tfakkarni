# ============================================================
# tracking-service — centralized config
# ============================================================
server:
  port: 18083

spring:
  servlet:
    context-path: /api/tracking
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${NEON_SHARED_DB_URL}
    username: ${NEON_SHARED_DB_USERNAME}
    password: ${NEON_SHARED_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  task:
    scheduling:
      pool:
        size: 5

medication:
  scheduler:
    enabled: true
    daily-update-cron: "0 0 0 * * *"
    periodic-update-cron: "0 0 */6 * * *"

followup:
  scheduler:
    cron: "0 0 22 * * *"

mailtrap:
  token: ${MAILTRAP_TOKEN}
  inbox-id: ${MAILTRAP_INBOX_ID}
  from: noreply@tfakkarni.com

telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN}"
  default-chat-id: "${TELEGRAM_CHAT_ID}"

alert:
  fallback-email: "doctor@gmail.com"

elevenlabs:
  api:
    key: ${ELEVENLABS_TRACKING_API_KEY}

daily:
  api-key: "${DAILY_API_KEY}"
  api-url: "https://api.daily.co/v1"

claude:
  api-key: "${GROQ_TRACKING_API_KEY}"
  api-url: "https://api.groq.com/openai/v1/chat/completions"
  model: "llama-3.1-8b-instant"

meeting:
  room-expiry-minutes: 60
