spring:
  application:
    name: user-service

  # config service/client — values below are fallbacks used when config-server is not running
  cloud:
    config:
      enabled: true
  config:
    import: optional:configserver:http://localhost:8888

  # Fallback datasource (overridden by config-server when running)
  datasource:
    url: ${NEON_DATABASE_URL:jdbc:postgresql://ep-purple-sun-aga3c9f6-pooler.c-2.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
    username: ${NEON_USER:neondb_owner}
    password: ${NEON_PASSWORD:npg_4kKCY7bocxUn}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 18081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

keycloak:
  server-url: http://localhost:8280
  realm: techhive
  admin:
    username: admin
    password: admin

didit:
  api-key: ${DIDIT_API_KEY:}
  workflow-id: ${DIDIT_WORKFLOW_ID:}

# actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always