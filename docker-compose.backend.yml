name: tfakkarni-app

services:
  # --- INFRASTRUCTURE ---
  discovery-service:
    container_name: tfakkarni-discovery
    build: { context: ./backend, dockerfile: discovery-service/Dockerfile }
    image: tfakkarni/discovery:latest
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-service
    ports: ["8762:8761"]
    networks: [tfakkarni-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  config-service:
    container_name: tfakkarni-config
    build: { context: ./backend, dockerfile: config-service/Dockerfile }
    image: tfakkarni/config:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports: ["8888:8888"]
    networks: [tfakkarni-network]
    depends_on:
      discovery-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  api-gateway:
    container_name: tfakkarni-gateway
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    image: tfakkarni/gateway:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["9090:9090"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # --- MICROSERVICES ---
  user-service:
    container_name: tfakkarni-user
    build: { context: ./backend, dockerfile: user-service/Dockerfile }
    image: tfakkarni/user:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18081:18081"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18081/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  game-service:
    container_name: tfakkarni-game
    build: { context: ./backend, dockerfile: game-service/Dockerfile }
    image: tfakkarni/game:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18082:18082"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18082/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  medical-service:
    container_name: tfakkarni-medical
    build: { context: ./backend, dockerfile: medical-service/Dockerfile }
    image: tfakkarni/medical:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18086:18086"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18086/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  alert-service:
    container_name: tfakkarni-alert
    build: { context: ./backend, dockerfile: alert-service/Dockerfile }
    image: tfakkarni/alert:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18084:18084"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18084/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  tracking-service:
    container_name: tfakkarni-tracking
    build: { context: ./backend, dockerfile: tracking-service/Dockerfile }
    image: tfakkarni/tracking:latest
    env_file: [.env]
