      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18083:18083"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18083/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  ml-service:
    container_name: tfakkarni-ml
    build: { context: ./backend, dockerfile: ml-service/Dockerfile }
    image: tfakkarni/ml:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18085:18085"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18085/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  medicament-validation-service:
    container_name: tfakkarni-medicament-validation
    build: { context: ./backend, dockerfile: medicament-validation-service/Dockerfile }
    image: tfakkarni/medicament-validation:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18087:18087"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18087/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  iot-service:
    container_name: tfakkarni-iot
    build: { context: ./backend, dockerfile: iot-service/Dockerfile }
    image: tfakkarni/iot:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18088:18088"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18088/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  assistant-service:
    container_name: tfakkarni-assistant
    build: { context: ./backend, dockerfile: assistant-service/Dockerfile }
    image: tfakkarni/assistant:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SERVER_PORT: 18089
    ports: ["18089:18089"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18089/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  analytics-service:
    container_name: tfakkarni-analytics
    build: { context: ./backend, dockerfile: analytics-service/Dockerfile }
    image: tfakkarni/analytics:latest
    env_file: [.env]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    ports: ["18090:18090"]
    networks: [tfakkarni-network]
    depends_on:
      config-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18090/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # --- OBSERVABILITY ---
  zipkin:
    container_name: tfakkarni-zipkin
    image: openzipkin/zipkin:latest
    ports: ["9411:9411"]
    networks: [tfakkarni-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # --- IOT STREAMER (Python mock) ---
  iot-streamer:
    container_name: tfakkarni-iot-streamer
    build:
      context: .
      dockerfile: iot/Dockerfile
    image: tfakkarni/iot-streamer:latest
    environment:
      MOCK_GPS: "true"
      MOCK_BPM: "true"
    networks: [tfakkarni-network]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128M } } }

networks:
  tfakkarni-network:
    name: tfakkarni-network
    driver: bridge
