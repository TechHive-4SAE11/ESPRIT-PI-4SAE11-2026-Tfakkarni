name: tfakkarni-backend

services:
  # --- INFRASTRUCTURE ---
  discovery-service:
    container_name: tfakkarni-discovery
    build: { context: ./backend, dockerfile: discovery-service/Dockerfile }
    image: tfakkarni/discovery:latest
    ports: ["8761:8761"]
    networks: [tfakkarni-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  config-service:
    container_name: tfakkarni-config
    build: { context: ./backend, dockerfile: config-service/Dockerfile }
    image: tfakkarni/config:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports: ["8888:8888"]
    networks: [tfakkarni-network]
    depends_on:
      discovery-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  api-gateway:
    container_name: tfakkarni-gateway
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    image: tfakkarni/gateway:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["9090:9090"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  # --- MICROSERVICES ---
  user-service:
    container_name: tfakkarni-user
    build: { context: ./backend, dockerfile: user-service/Dockerfile }
    image: tfakkarni/user:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18081:18081"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  game-service:
    container_name: tfakkarni-game
    build: { context: ./backend, dockerfile: game-service/Dockerfile }
    image: tfakkarni/game:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18082:18082"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  medical-service:
    container_name: tfakkarni-medical
    build: { context: ./backend, dockerfile: medical-service/Dockerfile }
    image: tfakkarni/medical:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18083:18083"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  alert-service:
    container_name: tfakkarni-alert
    build: { context: ./backend, dockerfile: alert-service/Dockerfile }
    image: tfakkarni/alert:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18084:18084"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  tracking-service:
    container_name: tfakkarni-tracking
    build: { context: ./backend, dockerfile: tracking-service/Dockerfile }
    image: tfakkarni/tracking:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18085:18085"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  ml-service:
    container_name: tfakkarni-ml
    build: { context: ./backend, dockerfile: ml-service/Dockerfile }
    image: tfakkarni/ml:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18086:18086"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  medicament-validation-service:
    container_name: tfakkarni-medicament-validation
    build: { context: ./backend, dockerfile: medicament-validation-service/Dockerfile }
    image: tfakkarni/medicament-validation:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18087:18087"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  iot-service:
    container_name: tfakkarni-iot
    build: { context: ./backend, dockerfile: iot-service/Dockerfile }
    image: tfakkarni/iot:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18088:18088"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  assistant-service:
    container_name: tfakkarni-assistant
    build: { context: ./backend, dockerfile: assistant-service/Dockerfile }
    image: tfakkarni/assistant:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      SERVER_PORT: 18089
    ports: ["18089:18089"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

  analytics-service:
    container_name: tfakkarni-analytics
    build: { context: ./backend, dockerfile: analytics-service/Dockerfile }
    image: tfakkarni/analytics:latest
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
    ports: ["18090:18090"]
    networks: [tfakkarni-network]
    depends_on: [config-service]
    deploy: { resources: { limits: { memory: 512M } } }

networks:
  tfakkarni-network:
    name: tfakkarni-network
    driver: bridge
